<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PIXEL NOVA — Voice Commander</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: 
        radial-gradient(ellipse 85% 45% at 50% -12%, rgba(255, 255, 255, 0.045), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(24, 24, 27, 0.65), transparent),
        #09090b;
      color: #f4f4f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
      overflow: hidden;
    }
    .brand-tag {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #a1a1aa;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
    }
    .brand-tag svg {
      color: #a1a1aa;
    }
    h2 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #ffffff 0%, #d4d4d8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .desc {
      font-size: 12px;
      color: #a1a1aa;
      max-width: 340px;
      margin-bottom: 22px;
      line-height: 1.45;
    }
    .mic-button-wrapper {
      position: relative;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mic-ring {
      position: absolute;
      width: 96px;
      height: 96px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      animation: micPulse 1.6s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
      pointer-events: none;
    }
    @keyframes micPulse {
      0% { transform: scale(0.85); opacity: 0.9; }
      50% { transform: scale(1.25); opacity: 0.15; }
      100% { transform: scale(0.85); opacity: 0.9; }
    }
    .mic-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #27272a 0%, #3f3f46 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5), inset 0 0 8px rgba(255, 255, 255, 0.15);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 2;
    }
    .mic-btn:hover {
      transform: scale(1.06);
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 0 24px rgba(255, 255, 255, 0.12);
    }
    .mic-btn.active {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      box-shadow: 0 0 32px rgba(239, 68, 68, 0.7);
    }
    .transcript-box {
      width: 100%;
      max-width: 370px;
      min-height: 76px;
      background: rgba(24, 24, 27, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13.5px;
      color: #f4f4f5;
      text-align: left;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(12px);
      transition: border-color 0.2s;
    }
    .transcript-box.empty {
      color: #71717a;
      font-style: italic;
    }
    .voice-options-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
      font-weight: 600;
      color: #a1a1aa;
      margin-bottom: 16px;
      cursor: pointer;
      user-select: none;
    }
    .voice-options-row input[type="checkbox"] {
      accent-color: #71717a;
      cursor: pointer;
      width: 14px;
      height: 14px;
    }
    .suggestions-label {
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #71717a;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .suggestions-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      max-width: 390px;
      margin-bottom: 20px;
    }
    .suggestion-chip {
      background: rgba(24, 24, 27, 0.75);
      color: #d4d4d8;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .suggestion-chip:hover {
      background: #27272a;
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }
    .btn-send {
      background: linear-gradient(135deg, #27272a 0%, #3f3f46 100%);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 11px 26px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: 0.4px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 16px rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .btn-send:hover:not(:disabled) {
      background: linear-gradient(135deg, #3f3f46 0%, #52525b 100%);
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }
    .btn-send:disabled {
      background: rgba(39, 39, 42, 0.5);
      border-color: rgba(255, 255, 255, 0.05);
      color: #52525b;
      box-shadow: none;
      cursor: not-allowed;
    }
    .footer-note {
      font-size: 9.5px;
      font-weight: 700;
      color: #71717a;
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 5px;
      letter-spacing: 0.4px;
    }
  </style>
</head>
<body>
  <div class="brand-tag">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    PIXEL NOVA ACCESSIBILITY
  </div>
  <h2>Voice Commander</h2>
  <p class="desc" id="status-desc">Allow microphone permission to speak compound or single commands hands-free.</p>

  <div class="mic-button-wrapper">
    <div class="mic-ring" id="mic-ring" style="display: none;"></div>
    <button class="mic-btn" id="btn-mic-toggle" title="Click to start/stop listening">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </button>
  </div>

  <div class="transcript-box empty" id="transcript-box">
    Listening... Speak your goal clearly
  </div>

  <label class="voice-options-row">
    <input type="checkbox" id="chk-auto-run" checked />
    <span>Auto-Execute immediately when speech finishes</span>
  </label>

  <div class="suggestions-label">Quick Multi-Command Tests</div>
  <div class="suggestions-grid">
    <button type="button" class="suggestion-chip" data-cmd="open carts and auto filling my details">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Open carts and auto filling my details
    </button>
    <button type="button" class="suggestion-chip" data-cmd="open amazon and go to my carts">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="16.5" y1="9.4" x2="7.55" y2="4.24"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
      Open amazon and go to my carts
    </button>
    <button type="button" class="suggestion-chip" data-cmd="search for laptop and press enter">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      Search for laptop and press enter
    </button>
    <button type="button" class="suggestion-chip" data-cmd="scroll down and click here">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
      Scroll down and click here
    </button>
    <button type="button" class="suggestion-chip" data-cmd="scroll up">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      Scroll up
    </button>
  </div>

  <button class="btn-send" id="btn-send" disabled>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    Dispatch & Run in PIXEL NOVA
  </button>

  <div class="footer-note">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    100% On-Device Voice Interface • Zero Audio Transmitted
  </div>

  <script type="module" src="./src/voice/voice.ts"></script>
</body>
</html>
